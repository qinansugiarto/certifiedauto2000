<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Digiroom Certified</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f4; --white:#fff; --ink:#110d0e; --ink2:#3d3d3d; --muted:#666;
  --line:#e3e3e3; --rule:#8a8a8a;
  --red:#d4111b; --red-dark:#b40d14; --red-soft:#fdecec;
  --hero:#141e28; --hero2:#0f1a26;
  --nav:#231f20; --nav-off:#9a9898;
  --green:#18753a; --green-soft:#e7f4ea; --amber:#8a5a00; --amber-soft:#fff3d6;
  --gold:#b98a1e; --silver:#8b939c; --bronze:#a8683a; --reg:#6b6b6b;
  --t-fast:120ms; --t-med:220ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#d9d9d9;-webkit-font-smoothing:antialiased;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity var(--t-fast)}
button:active{opacity:.65}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* iPhone 15: 393 x 852 pt. Full screen on a phone, framed on desktop. */
.phone{position:relative;width:100%;max-width:393px;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.island,.statusbar,.homebar{display:none}
@media (min-width:500px){
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
  .phone{padding-top:54px;height:852px;max-height:calc(100vh - 48px);border-radius:48px;box-shadow:0 0 0 11px #1b1b1b,0 0 0 13px #3a3a3a,0 30px 60px rgba(0,0,0,.35)}
  .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:20}
  .statusbar{display:flex;position:absolute;top:0;left:0;right:0;height:54px;padding:4px 34px 0;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;z-index:19;pointer-events:none}
  .statusbar svg{height:12px;width:auto;fill:#111}
  .statusbar .r{display:flex;gap:6px;align-items:center}
  .homebar{display:block;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#8c8c8c;z-index:20;pointer-events:none}
}

.appbar{flex:none;height:60px;padding:0 6px 0 17px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);position:relative;z-index:3}
.appbar.white{background:var(--white)}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark b{font-weight:800;font-size:20px;letter-spacing:-.04em;color:#111}
.wordmark small{font-size:8px;font-weight:700;color:var(--red);margin-top:3px;letter-spacing:.14em}
.appbar .acts{display:flex}
.appbar .acts button{width:44px;height:44px;display:grid;place-items:center;position:relative}
.appbar .acts svg{width:22px;height:22px;stroke:#333;stroke-width:2;fill:none}
.dot{position:absolute;top:6px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

.subbar{flex:none;height:56px;padding:0 8px;display:flex;align-items:center;gap:4px;background:var(--white);border-bottom:1px solid var(--line);position:relative;z-index:3}
.subbar .back{width:44px;height:44px;display:grid;place-items:center}
.subbar .back svg{width:22px;height:22px;stroke:#222;stroke-width:2.2;fill:none}
.subbar h1{font-size:16px;font-weight:700;flex:1}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.phone.notab .screen{padding-bottom:max(34px,env(safe-area-inset-bottom))}

.tabbar{flex:none;height:calc(64px + max(20px,env(safe-area-inset-bottom)));padding-bottom:max(20px,env(safe-area-inset-bottom));background:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);position:relative;z-index:3}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--nav-off);font-size:11px;font-weight:500;min-height:48px}
.tab svg{width:24px;height:24px}
.tab.on{color:#fff;font-weight:700}

/* Home */
.hero{margin:0 17px;border-radius:24px 24px 0 0;background:radial-gradient(160px 100px at 90% 100%,rgba(212,17,27,.5),transparent 70%),linear-gradient(180deg,var(--hero),var(--hero2));color:#fff;padding:20px 17px 30px}
.hero h2{font-size:16px;font-weight:600}
.hero .sub{font-size:12px;color:#c9d0d8;margin-top:2px}
.tierrow{display:flex;align-items:center;gap:12px;margin-top:16px}
.shield{flex:none;width:46px;height:52px}
.tierrow .col{flex:1}
.tierrow .col span{display:block;font-size:11px;color:#c9d0d8}
.tierrow .col strong{display:block;font-size:17px;font-weight:700}
.tierrow .cr{text-align:right}
.herobtn{margin-top:16px;width:100%;min-height:44px;border-radius:10px;background:#fff;color:var(--hero);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.herobtn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none}
.sheet{background:var(--white);border-radius:24px 24px 0 0;margin-top:-14px;position:relative;z-index:2;padding:20px 0 24px;box-shadow:0 -6px 14px rgba(0,0,0,.06)}
.sec-h{padding:0 17px;margin-top:24px}
.sec-h:first-child{margin-top:0}
.sec-h h3{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.sec-h p{font-size:12px;color:var(--ink2);margin-top:2px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:12px 17px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.qtile{flex:none;width:72px;text-align:center;display:flex;flex-direction:column;align-items:center}
.qtile .box{width:68px;height:68px;border-radius:10px;background:#f6f6f6;border:1px solid #e8e8e8;display:grid;place-items:center}
.qtile .box svg{width:42px;height:42px}
.qtile span{display:block;font-size:11px;line-height:1.35;color:var(--ink2);margin-top:8px}
.todo{margin:12px 17px 0;border-radius:12px;border:1.5px solid var(--red);background:var(--red-soft);padding:14px;display:block;width:calc(100% - 34px);text-align:left}
.todo .k{font-size:11px;font-weight:700;color:var(--red);letter-spacing:.06em;text-transform:uppercase}
.todo b{display:block;font-size:14px;margin-top:4px;line-height:1.4}
.todo p{font-size:12px;color:var(--ink2);margin-top:4px}
.todo .go{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12px;font-weight:700;color:var(--red)}
.todo .go svg{width:12px;height:12px;stroke:var(--red);stroke-width:2.6;fill:none}
.veh{margin:12px 17px 0;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.veh .top{display:flex;gap:12px;align-items:center}
.veh .pic{width:92px;height:62px;border-radius:8px;background:linear-gradient(180deg,#f7f7f7,#ececec);display:grid;place-items:center;flex:none}
.veh .pic svg{width:84px;height:56px}
.veh h4{font-size:14px;font-weight:700;line-height:1.35}
.veh .pl{font-size:12px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#f6f6f6;border-radius:8px;padding:8px 6px;text-align:center}
.stat span{display:block;font-size:10.5px;color:var(--muted)}
.stat b{display:block;font-size:12px;font-weight:700;margin-top:2px}

/* Kategori */
.cat-sec{padding:20px 17px 0}
.cat-h{display:flex;align-items:center;gap:12px}
.cat-h h3{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.cat-h i{flex:1;height:1.5px;background:var(--rule)}
.grid4{display:grid;grid-template-columns:repeat(4,75px);justify-content:space-between;row-gap:14px;margin-top:14px}
.ctile{text-align:center;display:flex;flex-direction:column;align-items:center}
.ctile .box{width:75px;height:75px;background:#fff;border-radius:12px;display:grid;place-items:center}
.ctile .box svg{width:52px;height:52px}
.ctile span{display:block;font-size:11px;line-height:1.35;color:#222;margin-top:8px}

/* Shared */
.pad{padding:16px 17px 28px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card+.card,.card+.coupon,.coupon+.card{margin-top:10px}
.lbl{font-size:12px;font-weight:700;color:var(--ink2);margin:16px 0 6px;display:block}
.lbl:first-child{margin-top:0}
.field{width:100%;border:1px solid #cfcfcf;border-radius:8px;padding:12px;font-size:14px;background:#fff;appearance:none;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #c9c9c9;border-radius:20px;padding:9px 14px;font-size:12px;font-weight:500;background:#fff;min-height:38px}
.chip.on{border-color:var(--red);color:var(--red-dark);background:var(--red-soft);font-weight:700}
.chip.off{color:#9a9a9a;border-color:#e6e6e6;background:#fafafa;text-decoration:line-through}
.btn{display:block;width:100%;min-height:48px;background:var(--red);color:#fff;border-radius:10px;padding:13px;font-size:14px;font-weight:700;text-align:center;margin-top:16px}
.btn.ghost{background:#fff;color:var(--red-dark);border:1.5px solid var(--red);margin-top:10px}
.btn.dark{background:var(--hero)}
.btn[disabled]{background:#cfcfcf;color:#fff;cursor:not-allowed;opacity:1}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:44px}
.row .ico{width:44px;height:44px;border-radius:10px;background:#f6f6f6;display:grid;place-items:center;flex:none}
.row .ico svg{width:30px;height:30px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.row .tx span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.chev{width:14px;height:14px;stroke:#999;stroke-width:2;fill:none;flex:none}
.price{font-size:14px;font-weight:700;color:var(--red-dark);margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--red-soft);color:var(--red-dark)}
.tag.g{background:var(--green-soft);color:var(--green)}.tag.k{background:#ececec;color:#4a4a4a}.tag.a{background:var(--amber-soft);color:var(--amber)}
.tag svg{width:11px;height:11px;stroke:currentColor;stroke-width:3;fill:none}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod .card{padding:10px;display:flex;flex-direction:column;margin-top:0}
.prod .img{height:92px;border-radius:8px;background:#f6f6f6;display:grid;place-items:center}
.prod .img svg{width:60px;height:60px}
.prod b{display:block;font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.35}
.prod .btn{margin-top:auto;min-height:40px;padding:8px;font-size:12px}
.carimg{height:120px;border-radius:8px;background:linear-gradient(180deg,#f7f7f7,#ececec);display:grid;place-items:center}
.carimg svg{width:150px;height:90px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:46px;font-size:13px;font-weight:600;color:#6b6b6b;border-bottom:2.5px solid transparent}
.tabs button.on{color:var(--red-dark);border-color:var(--red)}
.empty{text-align:center;padding:50px 30px;color:var(--muted);font-size:13px}
.empty svg{width:70px;height:70px;margin-bottom:10px}
.profile{background:var(--hero);color:#fff;padding:22px 17px;display:flex;align-items:center;gap:14px}
.avatar{width:54px;height:54px;border-radius:50%;background:#2c3a49;display:grid;place-items:center;font-weight:700;font-size:20px}
.menu .row{padding:8px 0;border-bottom:1px solid #eee}
.menu .row:last-child{border-bottom:0}
.menu .row .ico{width:36px;height:36px;border-radius:8px;background:var(--red-soft)}
.menu .row .ico svg{width:18px;height:18px;stroke:var(--red);stroke-width:2;fill:none}
.coupon{display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.coupon+.coupon{margin-top:10px}
.coupon .l{width:84px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;text-align:center}
.coupon .r{flex:1;padding:12px 14px}
.coupon .r b{font-size:13px;font-weight:600;display:block}.coupon .r span{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);background:#222;color:#fff;font-size:12.5px;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity var(--t-med),transform var(--t-med);pointer-events:none;z-index:9;max-width:340px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #cfcfcf;border-radius:8px;padding:0 12px}
.search input{border:0;outline:0;flex:1;padding:12px 0;font-size:14px;background:none}
.search svg{width:16px;height:16px;stroke:#777;stroke-width:2;fill:none}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots .chip{text-align:center;padding:9px 0}
.sum{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0}
.sum span{color:var(--ink2)}.sum b{font-weight:700;text-align:right}
.sum.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:15px}
.ok{width:64px;height:64px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center;margin:14px auto 12px}
.ok svg{width:30px;height:30px;stroke:var(--green);stroke-width:3;fill:none}
.sos{background:linear-gradient(135deg,#d4111b,#8f0a10);color:#fff;border-radius:14px;padding:20px;text-align:center}
.sos b{font-size:17px;display:block}.sos p{font-size:13px;margin-top:6px}
.sos .btn{background:#fff;color:var(--red-dark)}

/* Certified */
.pp-head{background:linear-gradient(180deg,var(--hero),var(--hero2));color:#fff;padding:18px 17px 22px}
.pp-head .tierrow{margin-top:0}
.pp-head .car{font-size:12px;color:#c9d0d8;margin-top:12px}
.meter{margin-top:12px}
.meter .top{display:flex;justify-content:space-between;font-size:12px}
.meter .top b{font-weight:700}
.bar{height:8px;border-radius:4px;background:#e6e6e6;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:4px;transition:width var(--t-med)}
.pp-head .bar{background:#2c3a49}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.segs i{height:8px;border-radius:4px;background:#e6e6e6}
.segs i.on{background:var(--red)}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:#e0e0e0}
.ev{position:relative;padding-bottom:16px}
.ev:last-child{padding-bottom:0}
.ev:before{content:"";position:absolute;left:-24px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #c4c4c4}
.ev.done:before{background:var(--green);border-color:var(--green)}
.ev.rep:before{background:var(--amber-soft);border-color:var(--amber)}
.ev.next:before{background:#fff;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.ev b{display:block;font-size:13px;font-weight:600}
.ev span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.ev .tag{margin-top:6px}
.ev button.lnk{margin-top:6px}
.lnk{font-size:12px;font-weight:700;color:var(--red-dark);text-decoration:underline;min-height:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:left;min-height:84px;display:flex;flex-direction:column;gap:6px}
.act svg{width:22px;height:22px;stroke:var(--red);stroke-width:2;fill:none}
.act b{font-size:13px;font-weight:700;line-height:1.3}
.act span{font-size:11.5px;color:var(--muted);line-height:1.35}
.item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.item:last-of-type{border-bottom:0}
.item .tx{flex:1}
.item b{font-size:13px;font-weight:600;display:block}
.item .tx>span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.item .tx>span.tag{display:inline-flex;color:#4a4a4a}
.item .amt{font-size:13px;font-weight:700;white-space:nowrap}
.sw{flex:none;width:46px;height:28px;border-radius:14px;background:#c9c9c9;position:relative;transition:background var(--t-med)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform var(--t-med)}
.sw[aria-checked=true]{background:var(--green)}
.sw[aria-checked=true]:after{transform:translateX(18px)}
.info{border-radius:10px;background:#eef3f8;color:#1f3a56;padding:12px;font-size:12px;margin-top:12px}
.info.warn{background:var(--amber-soft);color:#5c3c00}
.info b{font-weight:700}
.cert{border:2px solid var(--green);border-radius:14px;background:#fff;padding:18px;text-align:center}
.cert h2{font-size:15px;font-weight:700}
.cert .res{font-size:30px;font-weight:800;color:var(--green);margin-top:6px}
.tiercard{border-left:5px solid var(--c);}
.tiercard h4{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tiercard p{font-size:12px;color:var(--ink2);margin-top:4px}
.qr{width:168px;height:168px;margin:6px auto 0;display:block}
.center{text-align:center}
.h2{font-size:15px;font-weight:700}
.p{font-size:13px;color:var(--ink2);margin-top:6px}
.steps{counter-reset:s}
.steps li{list-style:none;position:relative;padding:0 0 12px 32px;font-size:13px;color:var(--ink2)}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--red-soft);color:var(--red-dark);font-size:12px;font-weight:700;display:grid;place-items:center}
.steps li b{color:var(--ink)}

/* ===== v2: modern layer ===== */
:root{--r-lg:20px;--r-md:14px;--shadow:0 6px 20px rgba(17,13,14,.07),0 1px 3px rgba(17,13,14,.06);--ease:cubic-bezier(.2,.8,.2,1)}
.screen>*{animation:rise .32s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.appbar{height:62px;padding:0 10px 0 12px;gap:8px;background:var(--white)}
.appbar .logo{height:30px;width:auto;display:block}
.carpill{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 10px 4px 4px;border-radius:24px;background:#f2f2f3;max-width:190px}
.carpill .th{width:40px;height:30px;border-radius:15px;overflow:hidden;background:#e4e4e6;flex:none;position:relative}
.carpill .th img,.carpill .th svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.carpill b{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.carpill small{font-size:10.5px;color:var(--muted);display:block;line-height:1.2}
.carpill .cv{width:14px;height:14px;stroke:#555;stroke-width:2.4;fill:none;flex:none;transform:rotate(90deg)}
.appbar .right{display:flex;align-items:center;gap:6px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;position:relative;border-radius:22px}
.iconbtn svg{width:22px;height:22px;stroke:#333;stroke-width:2;fill:none}

 for(let r=0;r<n;r++)for(let c=0;c<n;c++){let v=f(r,c);if(v<0){x=(x*1103515245+12345)&0x7fffffff;v=(x>>16)&1}if(v)o+=`<rect x="${c}" y="${r}" width="1" height="1"/>`}
 return `<svg class="${cls}" viewBox="-2 -2 29 29" role="img" aria-label="Kode QR verifikasi"><rect x="-2" y="-2" width="29" height="29" fill="#fff"/><g fill="#111">${o}</g></svg>`}

/* ---------- Prediksi harga ---------- */
function curve(rate,yrs){const a=[];for(let y=0;y<=yrs;y++)a.push(s.newPrice*Math.pow(1-rate,y));return a}
function priceChart(){
 const yrs=Math.max(6,Math.ceil(s.age)+1),A=curve(ice()?DEP.Silver:DEP.Gold,yrs),B=curve(DEP.Tercatat,yrs);
 const W=330,H=180,L=34,R=8,T=22,Bm=26,mx=s.newPrice,mn=Math.min(...B)*.92;
 const X=y=>L+(W-L-R)*y/yrs,Y=v=>T+(H-T-Bm)*(1-(v-mn)/(mx-mn));
 const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
 const sel=Math.min(s.yr,yrs);let g='';
 for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eee"/><text x="${L-6}" y="${Y(v)+4}" font-size="9.5" text-anchor="end" fill="#777">${Math.round(v)}</text>`}
 g+=`<text x="${L-6}" y="9" font-size="9" text-anchor="end" fill="#777">Rp jt</text>`;
 for(let y=0;y<=yrs;y++)g+=`<text x="${X(y)}" y="${H-8}" font-size="9.5" text-anchor="middle" fill="${y===sel?'#110d0e':'#777'}" font-weight="${y===sel?700:400}">${s.year+y}</text>`;
 const area=path(A)+` L${X(yrs)} ${Y(B[yrs])} `+B.map((v,i)=>'L'+X(yrs-i).toFixed(1)+' '+Y(B[yrs-i]).toFixed(1)).join(' ')+'Z';
 const now=Math.min(s.age,yrs);
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik prediksi harga jual ${s.car} ${s.year} sampai ${s.year+yrs}">
  ${g}<path d="${area}" fill="#d4111b" fill-opacity=".07"/>
  <line x1="${X(now)}" x2="${X(now)}" y1="${T}" y2="${H-Bm}" stroke="#141e28" stroke-dasharray="3 3" stroke-width="1"/>
  <text x="${X(now)+(now>yrs-1?-4:4)}" y="${T+8}" font-size="9.5" font-weight="700" fill="#141e28" text-anchor="${now>yrs-1?'end':'start'}">Sekarang</text>
  <path d="${path(B)}" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="5 3"/>
  <path d="${path(A)}" fill="none" stroke="#d4111b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="${X(sel)}" x2="${X(sel)}" y1="${Y(A[sel])}" y2="${Y(B[sel])}" stroke="#18753a" stroke-width="2"/>
  <circle cx="${X(sel)}" cy="${Y(A[sel])}" r="5" fill="#fff" stroke="#d4111b" stroke-width="3"/>
  <circle cx="${X(sel)}" cy="${Y(B[sel])}" r="4" fill="#fff" stroke="#8a8a8a" stroke-width="2.5"/></svg>
 <div class="legend"><span><i style="background:#d4111b"></i>${ice()?'Servis rutin di Auto2000':'Terawat, Certified Gold'}</span><span><i class="d"></i>Riwayat tidak lengkap</span></div>
 <div class="yrs" role="group" aria-label="Pilih tahun">${Array.from({length:yrs},(_,i)=>i+1).map(y=>`<button class="${y===sel?'on':''}" aria-pressed="${y===sel}" onclick="s.yr=${y};save();render()">${s.year+y}</button>`).join('')}</div>
 <div class="readout"><div class="a"><span>${ice()?'Servis rutin':'Certified Gold'}, ${s.year+sel}</span><b>${jt(A[sel])}</b></div><div><span>Riwayat tidak lengkap</span><b>${jt(B[sel])}</b></div></div>
 <p class="delta">Selisih <b>${jt(A[sel]-B[sel])}</b> di tahun ke-${sel}. Estimasi dari depresiasi mobil bensin dan hybrid 10-15% per tahun (OLXmobbi, 2025). Bukan jaminan harga.</p>`}

/* ---------- Actions ---------- */
function act(a,x){
 if(a==='toggle'){s[x]=!s[x];if(x==='share'&&!s.share)toast('Tautan riwayat dimatikan')}
 else if(a==='scn'){setScn(x);go('home');toast('Skenario: '+SC[x].label);return}
 else if(a==='car'){storeCar();loadCar(+x);s.yr=Math.min(5,Math.max(1,Math.ceil(s.age)));toast(s.car+' dipilih');go('home')}
 else if(a==='consent'){s.consent=true;toast('Passport aktif');go('passport')}
 else if(a==='cabut'){s.wa=false;s.appr=false;s.share=false;toast('Semua izin berbagi dicabut')}
 else if(a==='book'){s.order={name:nextName()||'Servis berkala',paid:paid()};go('booking-ok')}
 else if(a==='selesai'){const n=nextN(),name=nextName()||'Servis berkala',p=paid();
   if(!ice()){if(!s.sbi)s.sbi=true;else if(n<=7)s.svc7++;else if(n<=11)s.ver.push(n);
     if(p&&n<=11){if(!s.xstop)s.xtra++;if(s.tier!=='Tercatat')s.credit+=CREDIT;s.ontime++}
     if(n===7&&s.svc7===7&&!s.hhc){s.hhc='hari ini';s.certNo='A2C-2026-0'+(50000+seed()%9999)}}
   let naik='';if(s.reentry==='lulus'&&s.ontime>=2&&s.tier==='Bronze'){s.tier='Silver';s.ontime=0;naik='Silver'}
   s.prov=false;s.done={name,paid:p,naik};s.order=null;s.last='hari ini';s.nextDate='6 bulan lagi';s.notif++;go('hasil')}
 else if(a==='nota'){const n=nextN();s.rep.push(n);s.xstop=true;s.tier=s.tier==='Gold'?'Silver':s.rep.length>=2?'Bronze':s.tier;s.order=null;s.nextDate='6 bulan lagi';toast('Nota tersimpan dengan label dilaporkan pemilik');go('passport')}
 else if(a==='reentry'){s.reentry='booked';toast('Re-entry Inspection dijadwalkan')}
 else if(a==='reentry-lulus'){s.reentry='lulus';s.ontime=0;if(!s.hhc)s.hhc='hari ini';s.certNo=s.certNo||'A2C-2026-0'+(60000+seed()%9999);toast('Lulus inspeksi. e-Sertifikat terbit')}
 else if(a==='trade'){s.trade='submitted';s.appr=true;toast('Pengajuan terkirim ke appraiser')}
 else if(a==='trade-batal'){s.trade='none';toast('Pengajuan dibatalkan')}
 else if(a==='transfer'){s.transfer={code:String(100000+seed()%899999),until:'23 Nov 2026'};toast('Kode transfer dibuat')}
 else if(a==='transfer-batal'){s.transfer=null;toast('Kode transfer dibatalkan')}
 else if(a==='transfer-klaim'){const nm=s.car;s.cars.splice(s.ci,1);if(!s.cars.length){toast('Mobil dipindahkan');setScn('baru');go('home');return}loadCar(0);toast(nm+' sudah pindah ke pemilik baru');go('garasi')}
 else if(a==='add'){storeCar();let c;
   if(s.addOpt==='bekas'){const id=($('#aid')||{}).value||'',code=($('#acode')||{}).value||'';
     if(id.trim().toUpperCase()!==USED.id||code.trim()!==USED.code){$('#aerr').textContent='ID Mobil atau kode transfer tidak cocok. Coba '+USED.id+' dan '+USED.code+'.';$('#aerr').hidden=false;return}
     if(s.cars.some(c=>c.id===USED.id)){toast('Mobil ini sudah ada di garasi');return}
     c=JSON.parse(JSON.stringify(USED.car))}
   else{const m=($('#amodel')||{}).value||'Veloz Hybrid',pl=($('#aplate')||{}).value||'B 1 NEW';
     c=mk({id:'A2C-NEW-'+(1000+s.cars.length*733%8999),car:m,ph:/Zenix/.test(m)?'zenixv':/Avanza/.test(m)?'avanza':'yaris',plate:pl,year:2026,buy:'Hari ini',age:0,km:'0 km',kmYear:0,fuel:/Avanza/.test(m)?'bensin':'hybrid',newPrice:/Zenix/.test(m)?522:/Avanza/.test(m)?255:350,consent:false,tier:/Avanza/.test(m)?'Tercatat':'Gold',prov:true,sbi:false,svc7:0,garY:2029,garM:10,nextDate:'Bulan depan',last:'Belum ada',certNo:null,visits:[],spend:{servis:0,parts:0,bp:0}})}
   s.cars.push(c);loadCar(s.cars.length-1);toast(c.prev?'e-Sertifikat dan riwayat berpindah ke akun Anda':'Mobil ditambahkan');go(c.prev?'sertifikat':'home');return}
 else if(a==='odo'){s.odo=true;toast('Odometer tercatat. +50 poin')}
 else if(a==='rp'){s.rp=Math.max(0,Math.min(RAPOR().length-1,s.rp+(+x)));save();render();return}
 save();render()}

function predMini(){
 const yrs=Math.max(6,Math.ceil(s.age)+1),A=curve(ice()?DEP.Silver:DEP.Gold,yrs),B=curve(DEP.Tercatat,yrs),sel=Math.min(5,yrs);

function journey(){const st=[['1','Beli',true],['2','Servis pertama',s.sbi],['3','7 servis gratis',s.svc7>=7],['4','Certified Check',!!s.hhc],['5','e-Sertifikat',hasCert()]];
 const done=st.filter(x=>x[2]).length,cur=st.findIndex(x=>!x[2]);
 return `<div class="journey" role="list" aria-label="Perjalanan menuju e-Sertifikat"><span class="fill" style="width:calc(${Math.max(0,done-1)/4*100}% - ${Math.max(0,done-1)/4*28}px)"></span>${st.map(([n,l,ok],i)=>`<div role="listitem" class="${ok?'on':''} ${i===cur?'now':''}"><i>${ok?'✓':n}</i>${l}</div>`).join('')}</div>`}
function timeline(){
 const ev=(c,t,sub,x='')=>`<div class="ev ${c}"><b>${t}</b><span>${sub}</span>${x}</div>`;
 const ver=`<span class="tag g">${ui.check}Terverifikasi bengkel resmi</span>`, n=nextN(); let o='';
 o+=ev('done','Serah terima',s.buy+(s.prev?', pemilik pertama':', tercatat sejak baru'),ver);
 o+=s.sbi?ev('done','Servis bulan pertama','Mesin, sasis, dan bodi diperiksa',ver):ev('next','Servis bulan pertama','Jatuh tempo '+s.nextDate+', gratis',`<button class="lnk" onclick="go('booking')">Pilih jadwal</button>`);
 o+=s.svc7>=7?ev('done','Servis ke-1 s.d. 7 (T-CARE)','7 dari 7 servis gratis, parts asli tercatat',ver):ev(s.sbi?'next':'','Servis ke-1 s.d. 7 (T-CARE)',s.svc7+' dari 7 selesai. Tiap 6 bulan atau 10.000 km',s.sbi?`<button class="lnk" onclick="go('booking')">Pilih jadwal servis ke-${n}</button>`:'');
 o+=s.hhc?ev('done','Certified Check tahun ke-3','Hybrid Health Check: Good, '+s.hhc,ver+`<br><button class="lnk" onclick="go('sertifikat')">Lihat e-Sertifikat</button>`):ev('','Certified Check tahun ke-3','Cek baterai hybrid gratis, bodi, dan recall. e-Sertifikat terbit di sini');
 if(s.prev)o+=ev('done','Pindah tangan','e-Sertifikat diklaim dengan ID Mobil '+s.id,`<span class="tag a">Pemilik ke-2</span>`);
 for(let i=8;i<=11;i++){
  if(s.ver.includes(i))o+=ev('done','Servis ke-'+i,'Servis berbayar di bengkel resmi',ver);
  else if(s.rep.includes(i))o+=ev('rep','Servis ke-'+i,'Bengkel umum, nota diunggah',`<span class="tag a">Dilaporkan pemilik</span>`);
  else if(i===n&&s.svc7>=7)o+=ev('next','Servis ke-'+i,'Jatuh tempo '+s.nextDate,`<button class="lnk" onclick="go('cost')">Lihat estimasi biaya</button>`);
  else o+=ev('','Servis ke-'+i,'Berbayar, menambah garansi 6 bulan dan credit Rp250 rb');
 }
 o+=s.hhc5?ev('done','Certified Check tahun ke-5','Hybrid Health Check: Good, '+s.hhc5+'. e-Sertifikat diperbarui',ver):ev('','Certified Check tahun ke-5','Hybrid Health Check gratis terakhir');
 o+=ev(n>11?'next':'','Jual atau tukar tambah','e-Sertifikat pindah tangan dengan ID Mobil',`<button class="lnk" onclick="go('${n>11?'nilai':'pindah'}')">${n>11?'Buka nilai mobil saya':'Cara pindah tangan'}</button>`);
 return o}

/* ---------- Musik rapor (Web Audio, dibuat langsung di browser) ---------- */
const MUS={ctx:null,on:true,timer:null,next:0,step:0,
 start(){try{if(!this.on)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!this.ctx){this.ctx=new C();this.m=this.ctx.createGain();this.m.gain.value=0;const cp=this.ctx.createDynamicsCompressor();this.m.connect(cp);cp.connect(this.ctx.destination);const n=this.ctx.createBuffer(1,this.ctx.sampleRate*.2,this.ctx.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=n}
  this.ctx.resume();this.m.gain.cancelScheduledValues(this.ctx.currentTime);this.m.gain.linearRampToValueAtTime(.55,this.ctx.currentTime+1.2);
  if(this.timer)return;this.next=this.ctx.currentTime+.1;this.step=0;this.timer=setInterval(()=>this.sched(),60)}catch(e){}},
 stop(){if(!this.ctx||!this.timer)return;const t=this.ctx.currentTime;this.m.gain.cancelScheduledValues(t);this.m.gain.setValueAtTime(this.m.gain.value,t);this.m.gain.linearRampToValueAtTime(0,t+.5);clearInterval(this.timer);this.timer=null},
 tone(f,t,dur,type,g,cut){const c=this.ctx,o=c.createOscillator(),a=c.createGain(),l=c.createBiquadFilter();o.type=type;o.frequency.value=f;l.type='lowpass';l.frequency.value=cut||2400;a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+Math.min(.04,dur/4));a.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(l);l.connect(a);a.connect(this.m);o.start(t);o.stop(t+dur+.05)},
 kick(t){const c=this.ctx,o=c.createOscillator(),a=c.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);a.gain.setValueAtTime(.32,t);a.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(a);a.connect(this.m);o.start(t);o.stop(t+.35)},

/* ---------- Router ---------- */
function fit(){const k=innerWidth>=500?Math.min(1,(innerHeight-56)/880,(innerWidth-56)/420):1;document.documentElement.style.setProperty('--k',k)}
addEventListener('resize',fit);fit();
document.body.insertAdjacentHTML('afterbegin',DEFS3);
function render(){
  const r=(location.hash||'#home').slice(1);
  if(r!=='rapor')MUS.stop();
  const v=(S[r]||S.home)();
  const ph=$('#phone');ph.classList.toggle('hidenew',!s.shownew);
  $('#top').innerHTML=v.story?'':v.bar;
  $('#screen').innerHTML=v.story?'':v.body;
  let st=$('#storybox');if(!st){st=document.createElement('div');st.id='storybox';ph.appendChild(st)}
  st.innerHTML=v.story?v.body:'';
  const tb=$('#tabbar');
  tb.style.display=v.tab&&!v.story?'grid':'none';
  ph.classList.toggle('notab',!v.tab);
  if(v.tab)tb.innerHTML=tabbar(v.tab);
  document.querySelectorAll('#screen svg:not([role]),#storybox svg:not([role])').forEach(e=>e.setAttribute('aria-hidden','true'));
  if(v.story)storyTimer();
}
window.addEventListener('hashchange',()=>{render();$('#screen').scrollTop=0});
render();
</script>
